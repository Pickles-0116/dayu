<!DOCTYPE html>
<!-- 浏览器端自动化冒烟测试（仅开发期使用，不参与交付） -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>browser smoke</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="app">

  <!-- 与 index.html 完全一致的界面骨架由 _inject 载入 -->
  <div id="TESTLOG" style="position:fixed;left:-9999px"></div>
</div>
<script>
/* 捕获一切错误 */
window.__ERRORS = [];
window.onerror = function (m, s, l, c) { window.__ERRORS.push('onerror: ' + m + ' @' + l + ':' + c); };
window.addEventListener('unhandledrejection', function (e) { window.__ERRORS.push('reject: ' + e.reason); });
(function () {
  const oe = console.error;
  console.error = function () { window.__ERRORS.push('console.error: ' + [].join.call(arguments, ' ')); oe.apply(console, arguments); };
})();
</script>
<!-- 骨架：直接内联 index.html 的 body（由构建脚本注入） -->
<!--BODY-->
<script src="../data.js"></script>
<script src="../engine.js"></script>
<script src="../ui.js"></script>
<script>
/* ══════ 自动化驱动（异步泵：UI 用 setTimeout 串联，必须异步推进） ══════ */
(function () {
  const R = {
    steps: [], errors: window.__ERRORS, screens: {}, endings: [], legacies: 0,
    lives: 0, years: 0, ticks: 0, acts: {}, routesTaken: {}, modalsSeen: 0, confirmsSeen: 0,
    rates: {}, dexOpened: 0, dexCells: 0, dexGot: 0, dexCount: '(未展开)'
  };
  function log(s) { if (R.steps.length < 40) R.steps.push(s); }
  function cur() { const on = document.querySelector('.screen.is-on'); return on ? on.id : '(none)'; }
  function live(sel, root) {
    return [].slice.call((root || document).querySelectorAll(sel)).filter(function (b) { return !b.disabled; });
  }
  function flush() {
    document.getElementById('TESTLOG').textContent = 'RESULT_JSON=' + JSON.stringify({
      lives: R.lives, years: R.years, ticks: R.ticks, legacies: R.legacies,
      screens: R.screens, endings: R.endings.slice(0, 14),
      acts: R.acts, routesTaken: R.routesTaken,
      modalsSeen: R.modalsSeen, confirmsSeen: R.confirmsSeen,
      rates: R.rates, dexOpened: R.dexOpened, dexCells: R.dexCells,
      dexGot: R.dexGot, dexCount: R.dexCount,
      errors: R.errors.slice(0, 20), errorCount: R.errors.length,
      steps: R.steps
    });
  }
  function step() {
    R.ticks++;
    const scr = cur();
    R.screens[scr] = (R.screens[scr] || 0) + 1;

    /* 模态优先 */
    const m = document.querySelector('#modal-root .modal');
    if (m) {
      R.modalsSeen++;
      const opts = live('.opt', m);
      if (opts.length) { opts[Math.floor(Math.random() * opts.length)].click(); return; }
      if (m.classList.contains('modal--confirm')) {
        R.confirmsSeen++;
        const yes = m.querySelector('#cf-yes'), no = m.querySelector('#cf-no');
        (Math.random() < .5 && yes ? yes : no).click();   // 两条分支都要走到
        return;
      }
      const foot = live('.modal__foot button', m);
      if (foot.length) { foot[0].click(); return; }
      return;
    }

    if (scr === 'scr-origin') {
      const cards = document.querySelectorAll('.origin-card');
      if (!cards.length) { log('出身页无卡片'); return; }
      // 偶尔换批，验证 reroll
      const rr = document.getElementById('btn-reroll');
      if (rr && !rr.disabled && Math.random() < .3) { rr.click(); return; }
      cards[Math.floor(Math.random() * cards.length)].click();
      const cf = document.getElementById('btn-confirm-origin');
      if (cf && !cf.disabled) { cf.click(); R.lives++; log('第 ' + R.lives + ' 世 · 确认出身'); }
      return;
    }
    if (scr === 'scr-hud') {
      const rt = live('#route-list button[data-rid]');
      if (rt.length && Math.random() < .85) {
        const b = rt[0]; R.routesTaken[b.dataset.rid] = (R.routesTaken[b.dataset.rid] || 0) + 1;
        b.click(); return;
      }
      const fate = document.getElementById('btn-fate');
      if (fate && Math.random() < .5) { fate.click(); return; }
      const acts = live('#act-group button[data-act]');
      if (acts.length) {
        const a = acts[Math.floor(Math.random() * acts.length)];
        R.acts[a.dataset.act] = (R.acts[a.dataset.act] || 0) + 1;
        a.click(); return;
      }
      const nx = document.getElementById('btn-next-year');
      if (nx && !nx.disabled) { nx.click(); R.years++; return; }
      return;
    }
    if (scr === 'scr-ending') {
      const t = document.querySelector('#ending-body .ending-name');
      const nm = t ? t.textContent.trim() : '(无题)';
      const sealEl = document.querySelector('#ending-body .ending-seal');
      const seal = sealEl ? sealEl.textContent.trim() : '(无印)';
      if (R.endings[R.endings.length - 1] !== nm + '·' + seal) {
        R.endings.push(nm + '·' + seal);
        R.rates[seal] = (R.rates[seal] || 0) + 1;
        log('结局 · ' + nm + ' · ' + seal);
      }
      /* P1-4：图鉴面板展开一次，校验单元格数量与计数文案 */
      const tg = document.getElementById('dex-toggle');
      const body = document.getElementById('dex-body');
      if (tg && body && body.hasAttribute('hidden')) {
        tg.click();
        R.dexOpened++;
        R.dexCells = document.querySelectorAll('#dex-body .dex-cell').length;
        R.dexGot = document.querySelectorAll('#dex-body .dex-cell--got').length;
        const c = document.querySelector('#ending-body .dex__count');
        R.dexCount = c ? c.textContent.replace(/\s+/g, ' ').trim() : '(无)';
        return;                       /* 下一 tick 再离开，确认展开态不报错 */
      }
      const go = document.getElementById('to-legacy') || document.getElementById('to-restart');
      if (go) go.click();
      return;
    }
    if (scr === 'scr-legacy') {
      R.legacies++;
      const heir = live('#legacy-body .heir-card');
      if (heir.length) { heir[0].click(); return; }
      const c = document.getElementById('legacy-cancel');
      if (c) c.click();
      return;
    }
  }
  function pump() {
    try { step(); } catch (e) {
      R.errors.push('driver: ' + e.message + ' | ' + (e.stack || '').split('\n')[1]);
    }
    flush();
  }
  function start() { flush(); setInterval(pump, 8); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(start, 30); });
  else setTimeout(start, 30);
})();
</script>
</body>
</html>
