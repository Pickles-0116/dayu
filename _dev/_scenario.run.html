<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>定向场景测试 · 高危二次确认 / 传承页</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body>
<div id="TESTLOG" style="display:none"></div>
<script>
  window.__ERRORS = [];
  window.onerror = function (m, s, l, c, e) { window.__ERRORS.push('onerror: ' + m + ' @' + l + ':' + c); };
  window.addEventListener('unhandledrejection', function (ev) { window.__ERRORS.push('reject: ' + ev.reason); });
  (function () { const ce = console.error; console.error = function () { window.__ERRORS.push('console.error: ' + [].join.call(arguments, ' ')); ce.apply(console, arguments); }; })();
</script>


<div id="app">

  <!-- ══════ 界面 1 · 出身抽取 ══════ -->
  <main id="scr-origin" class="screen" aria-labelledby="origin-h">
    <div class="wrap">
      <div class="origin-head">
        <h1 class="world-title title-tight" id="origin-h">大　虞</h1>
        <div class="world-sub" id="origin-era">景元 <span class="lat">17</span> 年 · 第 <span class="lat">1</span> 代</div>
        <div id="house-bar"></div>
      </div>
      <div class="origin-grid" id="origin-grid" role="listbox" aria-label="出身卡"></div>
      <div class="origin-actions">
        <button class="btn" id="btn-reroll" type="button">换一批</button>
        <span class="meta" id="reroll-meta"></span>
        <button class="btn btn--primary" id="btn-confirm-origin" type="button" disabled>就此立命</button>
      </div>
    </div>
  </main>

  <!-- ══════ 界面 2 · 人生主界面 HUD ══════ -->
  <div id="scr-hud" class="screen">
    <header class="topbar">
      <div class="topbar__in">
        <div>
          <div class="topbar__era" id="hud-era">大虞 · 景元 <span class="lat">17</span> 年</div>
          <div class="age-block">
            <span class="age-big" id="hud-age">0</span><span class="age-unit">岁</span>
          </div>
        </div>
        <div class="topbar__spacer"></div>
        <div class="topbar__badges" id="hud-badges"></div>
      </div>
    </header>

    <div class="hud">
      <aside class="panel area-attr" aria-label="属性面板">
        <div id="float-layer"></div>
        <h2 class="hd3"><span class="ink-dot"></span>属性</h2>
        <div id="attr-list"></div>

        <div class="sub-block">
          <h3 class="hd3" style="font-size:var(--fs-sm);letter-spacing:.2em;"><span class="ink-dot"></span>命数（半隐）</h3>
          <div class="axis-list" id="axis-list"></div>
        </div>

        <div class="sub-block">
          <div class="num-line">
            <span class="attr-name" style="letter-spacing:.16em">健康</span>
            <b id="health-num">—</b>
          </div>
          <div class="health" id="health-bar"><div class="health__fill" id="health-fill" style="width:100%"></div></div>
          <div class="meta" id="health-note" style="margin-top:var(--sp-1)"></div>
        </div>

        <div class="sub-block">
          <div class="num-line">
            <span class="attr-name" style="letter-spacing:.16em">财帛</span>
            <b id="money-num">—</b>
          </div>
          <div class="meta" id="money-note" style="margin-top:var(--sp-1)"></div>
        </div>

        <div class="sub-block" id="cult-block" hidden>
          <div class="num-line">
            <span class="cultivation__tier" id="cult-tier">未入门</span>
            <b id="cult-num">—</b>
          </div>
          <div class="cultivation"><div class="cultivation__fill" id="cult-fill" style="width:0%"></div></div>
          <div class="meta" id="cult-note" style="margin-top:var(--sp-1)"></div>
        </div>

        <div class="sub-block">
          <h3 class="hd3" style="font-size:var(--fs-sm);letter-spacing:.2em;"><span class="ink-dot"></span>词条</h3>
          <div class="chips" id="tag-list"></div>
        </div>
      </aside>

      <section class="area-event narr" aria-label="事件与年度日志">
        <div class="narr__stage" id="narr-stage">
          <h2 class="narr__title" id="narr-title">—</h2>
          <hr class="ink-rule ink-rule--short" style="margin:var(--sp-2) 0 var(--sp-4)">
          <div class="narr__body" id="narr-body"></div>
        </div>
        <div class="logbox">
          <h2 class="hd3"><span class="ink-dot"></span>年度日志</h2>
          <div id="log-list"></div>
        </div>
      </section>

      <aside class="panel area-route" aria-label="路线进度">
        <h2 class="hd3"><span class="ink-dot"></span>路线</h2>
        <div id="route-list"></div>
        <div class="meta" id="route-foot" style="margin-top:var(--sp-4)"></div>
      </aside>
    </div>

    <footer class="actionbar">
      <div class="actionbar__in">
        <div class="fate-slot" id="fate-slot"></div>
        <div class="act-group" id="act-group"></div>
        <span class="actionbar__hint" id="act-hint"></span>
        <button class="btn btn--primary" id="btn-next-year" type="button">推进一年</button>
      </div>
    </footer>
  </div>

  <!-- ══════ 界面 4 · 结局页 ══════ -->
  <main id="scr-ending" class="screen"><div class="editorial" id="ending-body"></div></main>

  <!-- ══════ 界面 5 · 传承页 ══════ -->
  <main id="scr-legacy" class="screen"><div class="editorial" id="legacy-body"></div></main>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="modal-root" id="modal-root" role="presentation"></div>
<div class="toast-root" id="toast-root" aria-live="polite"></div>
<div class="veil" id="veil" aria-hidden="true"></div>

<!-- ══════ 脚本层 · 经典 script 标签，严格按 数据 → 引擎 → 界面 顺序加载 ══════ -->





<script src="../data.js"></script>
<script src="../engine.js"></script>
<script src="../ui.js"></script>
<script>
/* ══════ 定向场景测试 ══════
   随机play 触发不到的两条路径，在此以确定性状态强制驱动：
   ① P0-9④ 闭关高危二次确认（须显示扣血代价与「余下」气血）
   ② P0-7  传承页：立嗣 → 家产折算 → 下一代 gen 递增 → 门第档位
   ③ P1-4  图鉴跨代累计与 localStorage 往返                              */
(function () {
  const R = { checks: [], errors: window.__ERRORS };
  function ck(cond, label, detail) { R.checks.push((cond ? 'PASS ' : 'FAIL ') + label + (detail ? '  → ' + detail : '')); }
  function flush() {
    const okAll = R.checks.every(function (c) { return c.indexOf('PASS') === 0; }) && R.errors.length === 0;
    document.getElementById('TESTLOG').textContent = 'RESULT_JSON=' + JSON.stringify({
      pass: okAll,
      failed: R.checks.filter(function (c) { return c.indexOf('FAIL') === 0; }),
      total: R.checks.length,
      checks: R.checks,
      errors: R.errors
    });
  }
  function curScreen() { const on = document.querySelector('.screen.is-on'); return on ? on.id : '(none)'; }

  function run() {
    try {
      /* ─────────── 场景 ① 闭关二次确认 ─────────── */
      resetMeta();
      const o = ORIGINS.find(function (x) { return !x.beggar && !x.debt; });
      newLife(o);
      S.age = 30; S.phase = 'action'; S.actionDone = false;
      S.flags.修仙入门 = true; S.xianTier = 0; S.cult = 20;
      S.health = 100; S.healthMax = XIAN_CAP[0] || 150;
      render();

      const secl = ACTIONS.find(function (a) { return a.id === 'seclude'; });
      ck(!!secl, '存在「闭关」行动');
      ck(typeof secl.confirm === 'function', '闭关带二次确认（D-13）');
      ck(secl.ok(S), '当前状态下闭关可用');

      const before = S.health;
      onActionClick(secl);
      const modal = document.querySelector('.modal--confirm');
      ck(!!modal, '闭关弹出二次确认弹窗');
      if (modal) {
        const txt = modal.textContent;
        ck(txt.indexOf('慎') >= 0, '确认弹窗有「慎」印');
        ck(/余下/.test(txt), '确认弹窗显示「余下」气血（P0-9④要求）');
        ck(/成功率/.test(txt) && /代价/.test(txt), '确认弹窗列出成功率与代价');
        ck(!!modal.querySelector('#cf-no') && !!modal.querySelector('#cf-yes'), '确认弹窗双按钮');
        /* 先「作罢」：不应扣血 */
        modal.querySelector('#cf-no').click();
        ck(!document.querySelector('.modal--confirm'), '作罢后弹窗关闭');
        ck(S.health === before, '作罢不产生任何代价', S.health + ' vs ' + before);
        /* 再「决行」：应扣血 */
        S.phase = 'action'; S.actionDone = false;
        onActionClick(secl);
        const m2 = document.querySelector('.modal--confirm');
        ck(!!m2, '再次弹出确认');
        if (m2) {
          m2.querySelector('#cf-yes').click();
          ck(S.health < before || S.pendingEnd, '决行后扣减气血或直接判定',
            'health ' + S.health + ' / end ' + S.pendingEnd);
        }
      }

      /* ─────────── 场景 ② 传承页全链路 ─────────── */
      resetMeta();
      newLife(o);
      S.age = 62; S.rank = 3;
      S.attrs.财 = 9; S.attrs.望 = 8; S.attrs.脉 = 7;
      addChild('书香'); addChild('健硕');
      S.pendingEnd = 'pingdan';
      const genBefore = META.gens;
      finishToEnding();
      ck(curScreen() === 'scr-ending', '结局页已切入', curScreen());
      const seal = document.querySelector('#ending-body .ending-seal');
      ck(!!seal && /品$/.test(seal.textContent.trim()), 'P1-4 结局页盖有品第印', seal ? seal.textContent : '(无)');
      ck(!!document.querySelector('#ending-body .rating__scale .rating__tick--on'), 'P1-4 品第标尺高亮当前档');
      ck(document.querySelectorAll('#ending-body .dex-cell').length === Object.keys(ENDINGS).length,
        'P1-4 图鉴列全 ' + Object.keys(ENDINGS).length + ' 条',
        String(document.querySelectorAll('#ending-body .dex-cell').length));
      ck(!!document.querySelector('#ending-body .timeline'), 'P1-1 结局页含年表');
      ck(!!document.querySelector('#ending-body .epitaph'), '结局页含墓志铭');
      ck(!!document.querySelector('#ending-body .snapshot'), '结局页含属性快照');

      const toLegacy = document.getElementById('to-legacy');
      ck(!!toLegacy, 'P0-7 有子嗣时出现「承此门楣」');
      if (toLegacy) {
        toLegacy.click();
        ck(curScreen() === 'scr-legacy', '切入传承页', curScreen());
        const heirs = document.querySelectorAll('#legacy-body .heir-card');
        ck(heirs.length === 2, '传承页列出全部子嗣', String(heirs.length));
        ck(document.querySelectorAll('#legacy-body .house-tier').length === HOUSE_TIERS.length,
          'P0-7 门第三档全列出');
        ck(/质 ·/.test(document.querySelector('#legacy-body .heir-card').textContent), '子嗣卡显示天赋标签');
        heirs[0].click();
        ck(META.gens === genBefore + 1, 'P0-7 立嗣后代数递增', String(META.gens));
        ck(curScreen() === 'scr-origin', '立嗣后回到出身抽取页', curScreen());
        ck(INHERIT && INHERIT.财 > 0, 'P0-7 家产折算入下一代', JSON.stringify(INHERIT));
      }

      /* 下一代应带上「先人遗泽」 */
      const card = document.querySelector('#origin-grid .origin-card');
      ck(!!card, '新一代出身卡已渲染');
      ck(!!card && !!card.dataset.id, '出身卡带 data-id（可回查）');
      /* 走真实交互路径：点击卡片选中，再点确认 */
      card.click();
      ck(card.getAttribute('aria-selected') === 'true', '点击后出身卡进入选中态');
      const btnC = document.getElementById('btn-confirm-origin');
      ck(!!btnC && !btnC.disabled, '选中后「定此一生」可点');
      /* 同时验证省略 card 参数的回查分支不崩溃 */
      selectOrigin(card.dataset.id);
      ck(card.getAttribute('aria-selected') === 'true', 'selectOrigin 省略 card 参数亦可选中');
      confirmOrigin();
      ck(S.gen === 2, '新一代 gen = 2', String(S.gen));
      ck(S.houseLog.join('｜').indexOf('先人遗泽') >= 0, '新一代继承先人遗泽', S.houseLog.join('｜'));

      /* ─────────── 场景 ③ 图鉴持久化 ─────────── */
      const seen1 = dexStat().seen;
      ck(seen1 >= 1, 'P1-4 图鉴已记录上一世', String(seen1));
      const raw = localStorage.getItem('dayu_house_v1');
      ck(!!raw && JSON.parse(raw).dex && Object.keys(JSON.parse(raw).dex).length === seen1,
        'P1-4 图鉴已落盘 localStorage');
      META.dex = {}; loadMeta();
      ck(dexStat().seen === seen1, 'P1-4 图鉴可从 localStorage 复原', String(dexStat().seen));

      /* ─────────── 场景 ④ 无子嗣不出现传承入口 ─────────── */
      resetMeta();
      newLife(o);
      S.age = 50; S.children = []; S.pendingEnd = 'duanzi';
      finishToEnding();
      ck(!document.getElementById('to-legacy'), 'P0-7 无子嗣不出现「承此门楣」');
      ck(!!document.getElementById('to-restart'), '无子嗣仍可重开此命');

      /* ─────────── 场景 ⑤ 抄家清家产 ─────────── */
      resetMeta();
      newLife(o);
      S.age = 55; S.attrs.财 = 9; S.attrs.望 = 9; S.attrs.脉 = 9;
      addChild('书香'); S.flags.抄家 = true; S.pendingEnd = 'pingdan';
      finishToEnding();
      ck(!document.getElementById('to-legacy'), '抄家后不得传承（P0-7）');
    } catch (e) {
      R.errors.push('scenario: ' + e.message + ' | ' + (e.stack || '').split('\n')[1]);
    }
    flush();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(run, 60); });
  else setTimeout(run, 60);
})();
</script>
</body>
</html>
